<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12151d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Voltran</title>
    <!-- Paints the last theme before the app loads; main.tsx keeps voltran.theme current. -->
    <script>
      try {
        const cache = JSON.parse(localStorage.getItem('voltran.theme') ?? '{}');
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const properties = cache[cache.appearance === 'system' ? system : cache.appearance] ?? {};
        for (const [name, value] of Object.entries(properties)) {
          document.documentElement.style.setProperty(name, String(value));
        }
        if (properties['--bay']) {
          document.querySelector('meta[name="theme-color"]').content = properties['--bay'];
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
